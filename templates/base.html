
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}<title> Valhala Games </title>{% endblock %}

 <style>
    .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px 5%;
        background: #174d46;
        color: white;
        flex-wrap: wrap;
    }

    .navbar .brand {
        color: white;
        text-decoration: none;
        font-size: 21px;
        font-weight: bold;
    }

    .navbar .navbar-links {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    .navbar .navbar-links a {
        color: white;
        text-decoration: none;
    }

    .navbar .navbar-links a:hover {
        color: #b8e4d8;
    }

    .navbar .logout-form {
        margin: 0;
    }

    .navbar .navbar-logout-btn {
        padding: 9px 14px;
        background: white;
        color: #174d46;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .page-content {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 20px;
    }

    @media (max-width: 600px) {
        .navbar {
            align-items: flex-start;
            flex-direction: column;
        }

        .navbar .navbar-links {
            gap: 12px;
        }
    }
    * {
    box-sizing: border-box;
}

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
    }

    button {
        padding: 12px;
    }
</style>

</head>

<body>
    {% include "components/navbar.html" %}

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
