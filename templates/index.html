
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% extends "base.html" %}
   {% block title %} <title>Enter Transaction | Valhala Games</title> {% endblock %}

   {% block content %}
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2e6b63;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2e6b63;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #24564f;
        }

        .required {
            color: #c0392b;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>New Transaction</h1>
        <p class="subtitle">Enter the game transaction details below.</p>

        <form action="/" method="post">

            <div class="form-group">
                <label for="game_id">
                    Select Game <span class="required">*</span>
                </label>

                <select id="game_id" name="game_id" required>
                    <option value="">-- Choose a game --</option>

                    {% for game in games %}
                        <option value="{{ game.id }}">
                         {{ game.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="amount">
                    Amount <span class="required">*</span>
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter transaction amount"
                    required
                >
            </div>

            <div class="form-group">
                <label for="payment_mode">
                    Payment Mode <span class="required">*</span>
                </label>

                <select id="payment_mode" name="payment_mode" required>
                    <option value="">-- Choose payment mode --</option>

                    {% for mode in payment_modes %}
                        <option value="{{ mode.value }}">
                            {{ mode.value.replace('_', ' ').title() }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">Submit Transaction</button>
        </form>
        <br>
        {% if message %}
                <div class="error-message" role="alert">
                    {{ message }}
                </div>
            {% endif %}
    </div>
</body>
{% endblock %}
</html>
